<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This DOMAIN is For SALE!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #C1121F;
    --gold: #D4A017;
    --bg: #0A0A0A;
    --surface: #111111;
    --border: #222;
    --text: #F0EDE8;
    --muted: #7A7572;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(193,18,31,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 90%, rgba(212,160,23,0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 600px;
  }

  /* Top ornament */
  .ornament {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeDown 0.6s ease both;
  }
  .ornament-line {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .ornament-line::before,
  .ornament-line::after {
    content: '';
    width: 48px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
  }

  /* Badge */
  .badge {
    display: inline-block;
    background: var(--red);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 2px;
    margin-bottom: 20px;
    animation: fadeDown 0.6s 0.1s ease both;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 52px 48px;
    text-align: center;
    animation: fadeUp 0.7s 0.2s ease both;
    position: relative;
  }

  /* Corner accents */
  .card::before, .card::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    border-color: var(--gold);
    border-style: solid;
    opacity: 0.4;
  }
  .card::before { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
  .card::after  { bottom: 12px; right: 12px; border-width: 0 1px 1px 0; }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 7vw, 3.4rem);
    font-weight: 900;
    letter-spacing: -0.5px;
    line-height: 1;
    margin-bottom: 20px;
    color: var(--text);
  }

  .tld { color: var(--red); }

  .divider {
    width: 40px;
    height: 2px;
    background: var(--gold);
    margin: 0 auto 20px;
    opacity: 0.6;
  }

  .desc {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.75;
    max-width: 420px;
    margin: 0 auto 28px;
    font-weight: 300;
  }

  .price-block {
    margin: 28px 0;
    padding: 20px;
    border: 1px solid #2a2a2a;
    border-radius: 3px;
    background: rgba(212,160,23,0.04);
  }
  .price-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .price {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--gold);
    font-weight: 700;
  }

  /* Form */
  .form { margin-top: 32px; text-align: left; }
  .form-row { margin-bottom: 12px; }
  .form-row label {
    display: block;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-row input,
  .form-row textarea {
    width: 100%;
    padding: 12px 14px;
    background: #0D0D0D;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    transition: border-color 0.2s;
    outline: none;
  }
  .form-row input:focus,
  .form-row textarea:focus { border-color: var(--red); }
  .form-row textarea { resize: vertical; min-height: 80px; }

  .btn {
    width: 100%;
    padding: 14px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 3px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s, transform 0.15s;
  }
  .btn:hover { background: #9d0e18; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  /* Contact footer */
  .contact {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    gap: 28px;
    flex-wrap: wrap;
  }
  .contact a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: color 0.2s;
  }
  .contact a:hover { color: var(--text); }
  .contact-icon { font-size: 16px; }

  /* Success message */
  .success {
    display: none;
    text-align: center;
    padding: 24px;
    color: #4caf6e;
    font-size: 15px;
  }

  /* Animations */
  @keyframes fadeDown { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(16px);  } to { opacity:1; transform:translateY(0); } }

  /* Mobile */
  @media (max-width: 520px) {
    .card { padding: 36px 24px; }
    .contact { gap: 16px; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <div class="ornament">
    <span class="ornament-line">Premium Domain</span>
  </div>

  <div class="card">
    <div class="badge">For Sale</div>

    <h1>ispits-rk<span class="tld">.ma</span></h1>
    <div class="divider"></div>

    <p class="desc">
      A short, brandable .ma domain — ideal for [your niche, e.g. e-commerce, fintech, travel...] 
      targeting the Moroccan market. Direct type-in traffic included.
    </p>

   <!-- <div class="price-block">
      <div class="price-label">Asking Price</div>
      <div class="price">MAD XX,XXX &nbsp;/&nbsp; €X,XXX</div>
    </div>-->

    <!-- Replace action URL with your Formspree endpoint -->
    <form class="form" id="offerForm"
          action="https://formspree.io/f/xkoaoyyv"
          method="POST">

      <div class="form-row">
        <label>Your Name</label>
        <input type="text" name="name" placeholder="Ahmed Benali" required>
      </div>
      <div class="form-row">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="ahmed@company.ma" required>
      </div>
      <div class="form-row">
        <label>Your Offer (optional)</label>
        <input type="text" name="offer" placeholder="e.g. MAD 8,000">
      </div>
      <div class="form-row">
        <label>Message (optional)</label>
        <textarea name="message" placeholder="Tell us about your project..."></textarea>
      </div>

      <button type="submit" class="btn">Submit Offer →</button>
      <div class="success" id="successMsg">✓ Your offer has been received. We'll be in touch shortly.</div>
    </form>

    <div class="contact">
      <a href="mailto:adam1freesoul@icloud.com">
        <span class="contact-icon">✉</span> adam1freesoul@icloud.com
      </a>
      <a href="https://wa.me/212635105029" target="_blank">
        <span class="contact-icon">📱</span> WhatsApp
      </a>
    </div>
  </div>

</div>

<script>
  // Smooth form submission with Formspree
  const form = document.getElementById('offerForm');
  const success = document.getElementById('successMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('.btn');
    btn.textContent = 'Sending…';
    btn.disabled = true;

    try {
      const res = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });
      if (res.ok) {
        form.reset();
        success.style.display = 'block';
        btn.style.display = 'none';
      } else {
        btn.textContent = 'Try again';
        btn.disabled = false;
      }
    } catch {
      btn.textContent = 'Try again';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
